  - page: 25
    bbox: [0, 145, 596, 675]
    what: Pre-existing medical conditions cover - what we do not pay table (cross icons; grey = not applicable)
    text: |
      What we do not pay under the Pre-existing medical conditions cover (Not paid = excluded for that benefit, n/a = not applicable to that benefit):
      Any claim if the Pre-existing medical conditions cover was purchased less than 72 hours before your scheduled departure from Singapore: Trip cancellation and loss of deposit = Not paid; Trip postponement = Not paid; Trip cut short = n/a; Trip disruption = n/a.
      Any amounts refunded or compensation received regardless of the form of such refund/compensation. Examples of forms of refund/compensation include any cash, voucher, or form of credit, points or miles received as a refund or compensation: Trip cancellation and loss of deposit = Not paid; Trip postponement = Not paid; Trip cut short = Not paid; Trip disruption = Not paid.
      Any expenses to upgrade you to a better class or category of transport or accommodation compared to that in your original itinerary. For example, changing your flight from a budget airline to a full-service airline or an upgrade from an economy class seat to one in a better class: Trip cancellation and loss of deposit = n/a; Trip postponement = Not paid; Trip cut short = Not paid; Trip disruption = Not paid.
      The cost of your unused portion of the original transport ticket back to Singapore which you have already paid for: Trip cancellation and loss of deposit = n/a; Trip postponement = n/a; Trip cut short = Not paid; Trip disruption = n/a.
      Any additional travelling expenses if you have not purchased a return ticket to Singapore in your original itinerary: Trip cancellation and loss of deposit = n/a; Trip postponement = n/a; Trip cut short = Not paid; Trip disruption = n/a.
      Any other additional expenses you incur to extend your trip longer than what was originally scheduled: Trip cancellation and loss of deposit = n/a; Trip postponement = n/a; Trip cut short = n/a; Trip disruption = Not paid.
      Any claims for incurred expenses related to any mode of public transport such as, buses, taxis, private-hire vehicles, and any other ride-hailing or on-demand services: Trip cancellation and loss of deposit = n/a; Trip postponement = n/a; Trip cut short = Not paid; Trip disruption = Not paid.
      Any claim that results from your pre-booked flight being cancelled due to any fault on the airline's part such as aircrew rotation, rescheduled flights, operational requirements or mechanical breakdown of the airplane: Trip cancellation and loss of deposit = Not paid; Trip postponement = Not paid; Trip cut short = Not paid; Trip disruption = Not paid.

