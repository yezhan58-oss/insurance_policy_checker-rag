# Hand transcriptions of policy tables that text extraction cannot read correctly.
#
# Some tables carry their meaning in tick/cross icons that are part of a background image (no
# text), and some have multi-column cells whose lines interleave when extracted. For each table,
# src/ingest.py drops every extracted text line whose centre lies inside `bbox` (PDF points,
# [x0, y0, x1, y1], origin top-left) on `page` (1-based PDF page) and inserts `text` there instead.
#
# Row text is copied from the PDF text layer; Yes/No/Not paid/n/a were read from the rendered
# page and must be re-checked against the PDF if the policy file changes (see SNAPSHOT.md).

fwd:
  - page: 10
    bbox: [0, 398, 596, 800]
    what: events table for Trip cancellation / Trip postponement / Trip cut short (tick icons)
    text: |
      *Check the table below to see what events you can claim for.
      What events you can claim for (Yes = you can claim under that benefit, No = you cannot):
      You or your travel companion suffers a serious injury or illness and is medically unfit to travel as confirmed by a medical practitioner in writing (for Trip cut short benefit, this must be confirmed by a medical practitioner in writing while you or your travel companion are overseas): Trip cancellation and loss of deposit = Yes; Trip postponement = Yes; Trip cut short = Yes.
      You, your travel companion, or your family member, dies: Trip cancellation and loss of deposit = Yes; Trip postponement = Yes; Trip cut short = Yes.
      Your family member suffers a life-threatening illness or injury as confirmed by a medical practitioner in writing: Trip cancellation and loss of deposit = Yes; Trip postponement = Yes; Trip cut short = Yes.
      You or your travel companion needs to be a witness in court during your scheduled period of travel: Trip cancellation and loss of deposit = Yes; Trip postponement = Yes; Trip cut short = Yes.
      Your or your travel companion's home is seriously damaged by fire, or natural disaster, and as a result you cannot travel, or have to cut short your trip: Trip cancellation and loss of deposit = Yes; Trip postponement = Yes; Trip cut short = Yes.
      A serious public event happens in Singapore or at one of your travel destinations, which prevents you from starting or continuing the trip: Trip cancellation and loss of deposit = Yes; Trip postponement = Yes; Trip cut short = Yes.
      Your onward flight is cancelled by the airline due to airport, runway or airspace closure, or poor weather conditions, which forces the airplanes to be grounded: Trip cancellation and loss of deposit = Yes; Trip postponement = No; Trip cut short = No.
      The aircraft you are on-board is hijacked for more than 12 hours: Trip cancellation and loss of deposit = No; Trip postponement = No; Trip cut short = Yes.

  - page: 11
    bbox: [0, 108, 596, 416]
    what: travel costs table for Trip cancellation / Trip postponement / Trip cut short (tick icons)
    text: |
      Please refer to the table below to see what travel costs are covered.
      What we pay (Yes = paid under that benefit, No = not paid):
      Any unused accommodation and transport expenses (air, sea or land travel), excursions, tours and activities that you have paid in advance and cannot get back from any other source, as well as cancellation fees: Trip cancellation and loss of deposit = Yes; Trip postponement = No; Trip cut short = Yes.
      Any rebooking fees so that you can reorganise the trip (to the same destination as the original trip) to such later date within 180 days from your original scheduled departure date: Trip cancellation and loss of deposit = No; Trip postponement = Yes; Trip cut short = No.
      Any additional administrative expenses incurred where it is possible to amend the original return ticket (for travel via air, land or sea) and/or booking for accommodation; or Additional transport and/or accommodation expenses (economy class for transport and standard room for accommodation) for your immediate return to Singapore, if you are unable to amend your original return ticket (for travel via air, land or sea) and/or booking for accommodation: Trip cancellation and loss of deposit = No; Trip postponement = No; Trip cut short = Yes.

  - page: 15
    bbox: [0, 110, 596, 430]
    what: Theft of or damage to baggage - how much we pay table (multi-column cells)
    text: |
      How much we pay, by covered item:
      Mobile phone: with proof of purchase, the higher of the following, capped at the maximum benefit limit: [(24 - Age of the item in months) / 24 months] x proof of purchase price; or the telco trade-in value; or S$50.
      Laptop, tablet and other electronic devices: with proof of purchase, the higher of the following, capped at the maximum benefit limit: [(36 - Age of the item in months) / 36 months] x proof of purchase price; or S$50.
      Personal belongings including baggage: with proof of purchase, the higher of the following, capped at the maximum benefit limit: [(60 - Age of the item in months) / 60 months] x proof of purchase price; or S$50.
      Jewellery: with proof of purchase, 100% of the proof of purchase price, capped at the maximum benefit limit.
      Without proof of purchase (all items above): the current market value of the item as determined by us, up to S$50 per item. We will only pay for a maximum of 5 items without proof of purchase.

