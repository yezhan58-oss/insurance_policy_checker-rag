# Per-approach settings (brief section 8). Same model, embeddings, chunks and base prompt for all.
B0: {}                  # no retrieval
A0:
  top_k: 5
A2:
  top_k: 5
  min_relevant: 2       # rewrite the query if fewer than this many chunks are graded relevant
  max_rewrites: 2
A4:
  fallback_k: 8         # search depth used only if the benefit pick reply is unusable
  max_benefits: 3
  max_definitions: 6
# Exploratory, added 30 Oct after pre-registration (not in run.yaml's list, so the core runs never include it):
# the whole policy in the prompt, no retrieval. Needs MAX_LEN=131072 in scripts/run_eval.sbatch.
L0: {}
# Exploratory, added 4 Nov after the test results: ReAct tool agent (src/approaches/a3_react.py). Its growing
# conversation can pass the default 16k context, so run it with MAX_LEN=131072 like L0.
A3:
  top_k: 5              # chunks per search
  max_tool_calls: 8     # lookups before the agent must answer
A4D:                    # exploratory, 5 Nov: A4 + LLM picks definitions from the defined-terms list
  fallback_k: 8
  max_benefits: 3
  max_definitions: 6
  pick_definitions: true
  max_picked_definitions: 3   # added on top of the name matches
A0K10:                  # exploratory, 11 Nov: A0 with twice the passages (src/approaches/a0k10_simple.py)
  top_k: 10
# Optional, not built
A1:
  top_k: 15
